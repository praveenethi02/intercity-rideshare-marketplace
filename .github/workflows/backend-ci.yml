name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [development, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rideshare
          POSTGRES_PASSWORD: rideshare_ci
          POSTGRES_DB: rideshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rideshare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://rideshare:rideshare_ci@localhost:5432/rideshare
      ADMIN_NAME: CI Admin
      ADMIN_PHONE: "0770000001"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate throwaway secrets
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "OTP_HMAC_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=Ci1$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Apply migrations to PostgreSQL
        run: npm run migrate

      - name: Confirm migrations can run again
        run: npm run migrate

      - name: Seed the admin account
        run: npm run seed:admin

      - name: Start the server and check its health
        run: |
          npm start &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:4000/health; then
              echo
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          exit 1
